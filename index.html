<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Life</title>
  <meta name="theme-color" content="#111416">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Life">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="topbar" aria-label="Pages">
    <div class="pages" id="pages" role="tablist"></div>
    <div class="top-actions">
      <span class="sync-status" id="syncStatus"></span>
      <button class="new-btn" id="newBoardBtn" title="New board">+ New board</button>
      <button class="icon-btn" id="themeBtn" title="Light / dark" aria-label="Toggle theme">◐</button>
      <button class="icon-btn" id="menuBtn" title="Sync &amp; backup" aria-label="Menu">⋯</button>
    </div>
  </nav>

  <header class="top">
    <div>
      <h1 class="date" id="date"></h1>
      <div class="date-fa" id="dateFa" dir="rtl" lang="fa"></div>
      <div class="summary" id="summary"></div>
    </div>
  </header>

  <main class="boards" id="boards"></main>
  <main class="doc" id="doc" hidden>
    <div class="doc-paper">
      <div class="doc-tools" id="docTools" role="toolbar" aria-label="Formatting">
        <button data-cmd="h1" title="Big heading  (# )">H1</button>
        <button data-cmd="h2" title="Small heading  (## )">H2</button>
        <button data-cmd="p" title="Plain text">Text</button>
        <span class="sep"></span>
        <button data-cmd="ul" title="Bullet list  (- )">• List</button>
        <button data-cmd="ol" title="Numbered list  (1. )">1. List</button>
        <button data-cmd="todo" title="Task  ([] )">☐ Task</button>
        <button data-cmd="quote" title="Quote  (> )">❝</button>
        <span class="sep"></span>
        <button data-cmd="bold" title="Bold  (Ctrl/⌘ B)"><b>B</b></button>
        <button data-cmd="italic" title="Italic  (Ctrl/⌘ I)"><i>I</i></button>
        <button data-cmd="underline" title="Underline  (Ctrl/⌘ U)"><u>U</u></button>
        <span class="sep"></span>
        <button data-cmd="draw" title="Add a drawing">✎ Draw</button>
        <button data-cmd="dir" title="Writing direction: auto → right-to-left → left-to-right">⇆</button>
      </div>
      <div class="doc-body" id="docBody" contenteditable="true" spellcheck="true" dir="auto" data-ph="Start writing…" aria-label="Notepad"></div>
    </div>
  </main>

  <dialog id="sketchDlg" class="sketch-dlg">
    <div class="sketch-top" id="sketchTools">
      <button data-color="#1f2328" class="swatch-dot on" style="--c:#1f2328" aria-label="Black"></button>
      <button data-color="#8b9198" class="swatch-dot" style="--c:#8b9198" aria-label="Gray"></button>
      <button data-color="#d64545" class="swatch-dot" style="--c:#d64545" aria-label="Red"></button>
      <button data-color="#2f6fd1" class="swatch-dot" style="--c:#2f6fd1" aria-label="Blue"></button>
      <button data-color="#2f9e5a" class="swatch-dot" style="--c:#2f9e5a" aria-label="Green"></button>
      <button data-color="#e8a317" class="swatch-dot" style="--c:#e8a317" aria-label="Yellow"></button>
      <span class="sep"></span>
      <button data-size="2" class="size-dot" style="--d:4px" aria-label="Thin"></button>
      <button data-size="4" class="size-dot on" style="--d:7px" aria-label="Medium"></button>
      <button data-size="9" class="size-dot" style="--d:12px" aria-label="Thick"></button>
      <span class="sep"></span>
      <button data-tool="erase">Eraser</button>
      <button data-tool="undo">Undo</button>
      <button data-tool="clear">Clear</button>
    </div>
    <canvas id="sketchCanvas"></canvas>
    <div class="sketch-foot">
      <button class="btn ghost" id="sketchCancel">Cancel</button>
      <button class="btn" id="sketchSave">Done</button>
    </div>
  </dialog>

  <dialog id="menu">
    <h3>Text size</h3>
    <p class="muted">For everything on this device. Each card also has A− / A+ in its menu.</p>
    <div class="row text-size">
      <button class="btn ghost" id="textSmaller" aria-label="Smaller text">A−</button>
      <span id="textSizeLabel">100%</span>
      <button class="btn ghost" id="textBigger" aria-label="Bigger text">A+</button>
    </div>
    <h3>Sync</h3>
    <div id="syncBox"></div>
    <h3>Backup</h3>
    <button class="btn ghost" id="exportBtn">Export backup (.json)</button>
    <label class="btn ghost">Import backup<input type="file" id="importFile" accept="application/json" hidden></label>
    <button class="btn" id="closeMenu">Close</button>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
