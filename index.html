<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Life</title>
  <meta name="theme-color" content="#0a0a0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Life">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="topbar" aria-label="Pages">
    <div class="pages" id="pages" role="tablist"></div>
    <div class="top-actions">
      <span class="sync-status" id="syncStatus"></span>
      <button class="new-btn" id="newBoardBtn" title="New board">+ New board</button>
      <button class="icon-btn" id="themeBtn" title="Light / dark" aria-label="Toggle theme">◐</button>
      <button class="icon-btn" id="menuBtn" title="Sync &amp; backup" aria-label="Menu">⋯</button>
    </div>
  </nav>

  <header class="top">
    <div>
      <h1 class="date" id="date"></h1>
      <div class="summary" id="summary"></div>
    </div>
  </header>

  <main class="boards" id="boards"></main>

  <dialog id="menu">
    <h3>Sync</h3>
    <div id="syncBox"></div>
    <h3>Backup</h3>
    <button class="btn ghost" id="exportBtn">Export backup (.json)</button>
    <label class="btn ghost">Import backup<input type="file" id="importFile" accept="application/json" hidden></label>
    <button class="btn" id="closeMenu">Close</button>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
