# Life bot — Cloudflare settings. Secrets and the AI service are set in the Cloudflare dashboard
# (life-bot → Settings → Variables and Secrets); see README.md.
name = "life-bot"
main = "src/worker.js"
compatibility_date = "2026-11-01"
keep_vars = true # keep the variables you add in the Cloudflare dashboard when the bot is rebuilt

[vars]
TZ = "Asia/Tehran"           # your time zone
LANG = "fa"                  # "fa" or "en": the bot's own texts (in chat it answers in your language)
MORNING = "08:00"            # morning brief; "" turns it off
EVENING = "21:00"            # evening review; "" turns it off
GITHUB_REPO = "omidiz/life"  # the repository the bot may edit (needs the GITHUB_REPO_TOKEN secret)

# The bot's "room": receives messages, answers them one by one, and keeps the bot's memory.
[[durable_objects.bindings]]
name = "ROOM"
class_name = "ChatRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoom"]

# Every 5 minutes: reminders, morning brief, evening review, build notices.
[triggers]
crons = ["*/5 * * * *"]

# Keep the bot's logs in Cloudflare (life-bot → Observability), to see what went wrong when something does.
[observability]
enabled = true
