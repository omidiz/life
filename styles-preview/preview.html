<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,-apple-system,sans-serif;background:#fff;color:#0a0a0a}
.frame{width:1200px;padding:40px;}
.date{font-size:34px;font-weight:700;letter-spacing:-.03em}.sum{color:#888;margin:6px 0 28px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.board{display:flex;flex-direction:column;min-height:300px;padding:22px}
.name{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline}
.name small{font-size:13px;font-weight:400;color:#888}
ul{list-style:none;flex:1}li{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid #e6e6e6;font-size:17px}
li:last-child{border:none}.c{width:22px;height:22px;border:1.5px solid currentColor;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px}
li.d{color:#999;text-decoration:line-through}li.d .c{background:#0a0a0a;color:#fff;border-color:#0a0a0a}
.add{color:#999;border-top:1px dashed #ddd;padding-top:12px}

/* 1 Outline (current) */
.s1 .board{border:1.5px solid #0a0a0a;border-radius:20px}

/* 2 Ink: solid black boards */
.s2 .board{background:#0a0a0a;color:#fff;border-radius:22px}
.s2 li{border-color:#2a2a2a}.s2 .name small,.s2 .add{color:#777}.s2 .add{border-color:#333}
.s2 li.d{color:#666}.s2 li.d .c{background:#fff;color:#000;border-color:#fff}

/* 3 Paper: editorial serif, no boxes */
.s3 .date{font-family:'Instrument Serif',serif;font-weight:400;font-size:54px;letter-spacing:-.01em}
.s3 .grid{gap:0}.s3 .board{border-top:3px solid #0a0a0a;padding:16px 22px 22px 0;margin-right:22px}
.s3 .name{font-family:'Instrument Serif',serif;font-weight:400;font-size:40px;letter-spacing:0}
.s3 .c{border-radius:3px;width:18px;height:18px}

/* 4 Mono: brutalist, monospace, hard shadow */
.s4 body,.s4 .frame{font-family:'JetBrains Mono',monospace}
.s4 .date{font-size:28px;text-transform:uppercase;letter-spacing:0}
.s4 .board{border:3px solid #0a0a0a;box-shadow:8px 8px 0 #0a0a0a;border-radius:0}
.s4 .name{font-size:20px;text-transform:uppercase;letter-spacing:.05em;border-bottom:3px solid #0a0a0a;padding-bottom:10px}
.s4 li{font-size:15px}.s4 .c{border-radius:0;border-width:2px}

/* 5 Soft: grey cards, no borders */
.s5 .frame{background:#fff}.s5 .board{background:#f3f3f3;border-radius:28px;padding:26px}
.s5 li{border-color:#e2e2e2}.s5 .name{font-weight:600}

/* 6 Big Type: huge titles, minimal lines */
.s6 .date{font-size:64px;font-weight:800;letter-spacing:-.05em;line-height:1}
.s6 .board{border-left:2px solid #0a0a0a;padding:4px 24px 20px}
.s6 .name{font-size:44px;font-weight:800;letter-spacing:-.05em;flex-direction:column;gap:2px}
.s6 li{border:none;padding:6px 0;font-size:18px}.s6 .add{border:none}
</style></head><body>
<script>
const boards=[['Study',[['Chapter 4 exercises'],['Review flashcards',1],['مرور درس ریاضی']]],['Work',[['Send weekly report'],['Prepare slides for Monday'],['Call the client',1]]],['Health',[['Leg day'],['Drink 2L water'],['Sleep before 12']]]];
const html=boards.map(([n,t])=>`<div class="board"><div class="name">${n}<small>${t.filter(x=>!x[1]).length} to do</small></div><ul>${t.map(([x,d])=>`<li class="${d?'d':''}"><span class="c">${d?'✓':''}</span><span dir="auto">${x}</span></li>`).join('')}</ul><div class="add">+ Add a task</div></div>`).join('');
for(let i=1;i<=6;i++)document.write(`<div class="s${i}" id="s${i}"><div class="frame"><div class="date">Friday, November 20</div><div class="sum">7 to do · 2 done today</div><div class="grid">${html}</div></div></div>`);
</script></body></html>
